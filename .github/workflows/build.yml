name: Build and test SRC Learning

on:
  workflow_dispatch:
  push:
    branches:
      - ver2.1-integration
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: SRC-Learning-Windows-x64
            artifact_path: dist/LuyenThiHinhAnh.exe
            spec_file: study_app.spec
          - os: macos-15
            artifact_name: SRC-Learning-macOS-Apple-Silicon.zip
            artifact_path: dist/SRC-Learning-macOS-Apple-Silicon.zip
            spec_file: study_app_macos.spec
          - os: ubuntu-22.04
            artifact_name: SRC-Learning-Linux-x64
            artifact_path: dist/LuyenThiHinhAnh
            spec_file: study_app.spec

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build Core application
        run: python -m PyInstaller --clean --noconfirm ${{ matrix.spec_file }}

      - name: Smoke test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $app = Start-Process -FilePath "dist/LuyenThiHinhAnh.exe" -PassThru
          Start-Sleep -Seconds 10
          $app.Refresh()
          if ($app.HasExited) {
            throw "Windows app exited during startup (exit code: $($app.ExitCode))."
          }
          Stop-Process -Id $app.Id

      - name: Archive intact macOS application bundle
        if: runner.os == 'macOS'
        run: >-
          python tools/macos_release.py package
          --app "dist/SRC Learning.app"
          --archive "${{ matrix.artifact_path }}"

      - name: Verify extracted macOS bundle and launch real GUI
        if: runner.os == 'macOS'
        run: >-
          python tools/macos_release.py verify
          --archive "${{ matrix.artifact_path }}"
          --source-app "dist/SRC Learning.app"
          --launch
          --report dist/macos-release-verification.json

      - name: Upload platform artifact
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      # Upload the already-built ZIP verbatim. Uploading .app directories loses
      # framework symlinks; wrapping this ZIP again also confuses installation.
      - name: Upload macOS ZIP without re-archiving
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.artifact_path }}
          archive: false
          if-no-files-found: error

      - name: Upload macOS verification evidence
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: SRC-Learning-macOS-verification
          path: |
            dist/macos-release-verification.json
            dist/SRC-Learning-macOS-Apple-Silicon.zip.sha256
          if-no-files-found: error

name: Build and test SRC Learning

on:
  workflow_dispatch:
  push:
    branches:
      - ver2.1-integration
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: SRC-Learning-Windows-x64
            artifact_path: dist/LuyenThiHinhAnh.exe
            spec_file: study_app.spec
          - os: macos-14
            artifact_name: SRC-Learning-macOS-Apple-Silicon
            artifact_path: dist/SRC Learning.app
            spec_file: study_app_macos.spec
          - os: ubuntu-22.04
            artifact_name: SRC-Learning-Linux-x64
            artifact_path: dist/LuyenThiHinhAnh
            spec_file: study_app.spec

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build Core application
        run: python -m PyInstaller --clean --noconfirm ${{ matrix.spec_file }}

      - name: Smoke test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $app = Start-Process -FilePath "dist/LuyenThiHinhAnh.exe" -PassThru
          Start-Sleep -Seconds 10
          $app.Refresh()
          if ($app.HasExited) {
            throw "Windows app exited during startup (exit code: $($app.ExitCode))."
          }
          Stop-Process -Id $app.Id

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

name: Build and test SRC Learning

on:
  workflow_dispatch:
  push:
    branches:
      - ver2.1-integration
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: SRC-Learning-Windows-x64.zip
            artifact_path: dist/SRC-Learning-Windows-x64.zip
            spec_file: study_app.spec
          - os: macos-15
            artifact_name: SRC-Learning-macOS-Apple-Silicon.zip
            artifact_path: dist/SRC-Learning-macOS-Apple-Silicon.zip
            spec_file: study_app_macos.spec
          - os: ubuntu-22.04
            artifact_name: SRC-Learning-Linux-x64
            artifact_path: dist/LuyenThiHinhAnh
            spec_file: study_app.spec

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build Core application
        run: python -m PyInstaller --clean --noconfirm ${{ matrix.spec_file }}

      - name: Prepare public CPV package and verify latest DSS metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/release_gui_qa.py prepare --workdir "$env:RUNNER_TEMP/src-learning-release-qa"

      - name: Test CPV import dialogs and AIL session preservation
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # QMessageBox.exec_ can access-violate in Qt's Windows offscreen
          # plugin. These are real modal GUI flows on the interactive runner.
          QT_QPA_PLATFORM: windows
        run: python -X faulthandler -u tools/release_gui_qa.py qt --workdir "$env:RUNNER_TEMP/src-learning-release-qa"

      - name: Install QA-only Windows desktop automation
        if: runner.os == 'Windows'
        run: python -m pip install "pywinauto==0.6.9" "psutil>=7,<9"

      - name: Test actual Windows EXE with real CPV downloads through GUI
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/release_gui_qa.py windows --workdir "$env:RUNNER_TEMP/src-learning-release-qa" --exe dist/LuyenThiHinhAnh.exe

      - name: Recheck DSS metadata and package verified Windows EXE
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/release_gui_qa.py prepare --workdir "$env:RUNNER_TEMP/src-learning-release-qa"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/windows_release.py --exe dist/LuyenThiHinhAnh.exe --qa-dir "$env:RUNNER_TEMP/src-learning-release-qa" --archive "${{ matrix.artifact_path }}"

      - name: Archive intact macOS application bundle
        if: runner.os == 'macOS'
        run: >-
          python tools/macos_release.py package
          --app "dist/SRC Learning.app"
          --archive "${{ matrix.artifact_path }}"

      - name: Verify extracted macOS bundle and launch real GUI
        if: runner.os == 'macOS'
        run: >-
          python tools/macos_release.py verify
          --archive "${{ matrix.artifact_path }}"
          --source-app "dist/SRC Learning.app"
          --launch
          --report dist/macos-release-verification.json

      - name: Upload platform artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      # Upload the already-built ZIP verbatim. Uploading .app directories loses
      # framework symlinks; wrapping this ZIP again also confuses installation.
      - name: Upload desktop ZIP without re-archiving
        if: runner.os == 'macOS' || runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.artifact_path }}
          archive: false
          if-no-files-found: error

      - name: Upload Windows GUI verification evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: SRC-Learning-Windows-GUI-verification
          path: |
            ${{ runner.temp }}/src-learning-release-qa/*-gui-report.json
            ${{ runner.temp }}/src-learning-release-qa/metadata.json
            ${{ runner.temp }}/src-learning-release-qa/*.png
            ${{ runner.temp }}/src-learning-release-qa/*-controls.txt
            ${{ runner.temp }}/src-learning-release-qa/*-crash-log.txt
            dist/windows-release-info.json
            dist/SRC-Learning-Windows-x64.zip.sha256
          if-no-files-found: warn

      - name: Upload macOS verification evidence
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: SRC-Learning-macOS-verification
          path: |
            dist/macos-release-verification.json
            dist/SRC-Learning-macOS-Apple-Silicon.zip.sha256
          if-no-files-found: error
